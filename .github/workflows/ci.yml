name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system GL for offscreen rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libosmesa6 ffmpeg
      - name: install (CPU torch first, so no CUDA wheel is resolved)
        run: |
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: tests (MiniLM download excluded; the runner may be offline)
        run: python -m pytest tests -q --deselect tests/test_text.py::test_minilm_encoder_and_cache

  cpp-ort:
    # C++ policy step (cpp/act_ort.cpp) against ONNX Runtime 1.30.0 must match PyTorch (cpp/ci.sh).
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (CPU torch, the simulator without lerobot, no text encoder)
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "so-arm100-sim @ git+https://github.com/AungKaung1928/so-arm100-sim.git@38569ac2132aaac0a1c61d945f932eb407060b66" numpy==2.2.6 onnxruntime==1.30.0 onnx==1.23.0
          pip install -e . --no-deps
      - run: cpp/ci.sh
