name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system GL for offscreen rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libosmesa6 ffmpeg
      - name: install (CPU torch first, so no CUDA wheel is resolved)
        run: |
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: tests (MiniLM download excluded; the runner may be offline)
        run: python -m pytest tests -q --deselect tests/test_text.py::test_minilm_encoder_and_cache

  cpp-ort:
    # C++ policy step (cpp/act_ort.cpp) against ONNX Runtime 1.30.0 must match PyTorch (cpp/ci.sh).
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (CPU torch, the simulator without lerobot, no text encoder)
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "so-arm100-sim @ git+https://github.com/AungKaung1928/so-arm100-sim.git@38569ac2132aaac0a1c61d945f932eb407060b66" numpy==2.2.6 onnxruntime==1.30.0 onnx==1.23.0
          pip install -e . --no-deps
      - run: cpp/ci.sh
        env:
          WORK: ${{ runner.temp }}/ort
      - name: hand the exported graph, its reference chunks and ONNX Runtime to the ROS 2 job
        run: |
          w="$RUNNER_TEMP/ort"; d="$RUNNER_TEMP/dist"
          mkdir -p "$d/ort_lib"
          cp -r "$w/act" "$d/act"
          cp -r "$w/ort/include/onnxruntime/core/session" "$d/ort_include"
          cp -L "$w/lib/libonnxruntime.so.1" "$d/ort_lib/"
      - uses: actions/upload-artifact@v4
        with:
          name: act-ort
          path: ${{ runner.temp }}/dist
          retention-days: 3

  ros2:
    # ROS 2 node (ros2/so_arm100_vla_ros) in the ros:humble container: its published trajectory
    # must equal the PyTorch chunk of the cpp-ort job's graph (colcon test).
    needs: cpp-ort
    runs-on: ubuntu-latest
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/so-arm100-vla
      - uses: actions/download-artifact@v4
        with:
          name: act-ort
          path: /tmp/act-ort
      - name: rosdep (build, test)
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src/so-arm100-vla/ros2 --ignore-src -y --rosdistro humble \
            --dependency-types build --dependency-types build_export \
            --dependency-types buildtool --dependency-types buildtool_export --dependency-types test
      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths src/so-arm100-vla/ros2 --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DORT_INCLUDE=/tmp/act-ort/ort_include \
            -DORT_LIB=/tmp/act-ort/ort_lib -DACT_TEST_DATA=/tmp/act-ort/act
      - name: colcon test
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --base-paths src/so-arm100-vla/ros2 --event-handlers console_direct+
          colcon test-result --verbose
